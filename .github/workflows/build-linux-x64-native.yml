name: Build Linux x64 Native Engine

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Parallelism (make -jN)'
        required: false
        default: '4'

permissions:
  contents: write

env:
  PLATFORM: linux-x64-glibc

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            python3 git curl binutils flex bison gperf \
            zip unzip gettext \
            libfontconfig-dev libfreetype-dev libharfbuzz-dev \
            libgraphite2-dev libxml2-dev libxslt1-dev zlib1g-dev \
            libjpeg-dev libpng-dev libtiff-dev libglib2.0-dev
          echo "=== Tool versions ==="
          gcc --version | head -1
          make --version | head -1
          autoconf --version | head -1
          node --version
          echo "=== Key tools check ==="
          which gperf && gperf --version | head -1
          pkg-config --modversion fontconfig || echo "fontconfig NOT found"
          pkg-config --modversion freetype2 || echo "freetype2 NOT found"
          pkg-config --modversion harfbuzz || echo "harfbuzz NOT found"

      - name: Checkout LibreOffice core
        run: |
          node scripts/checkout-core.mjs
          echo "=== Core revision ==="
          git -C .build/core rev-parse HEAD
          echo "=== Core source size ==="
          du -sh .build/core

      - name: Configure (autogen)
        run: |
          node scripts/build-native.mjs \
            --platform ${{ env.PLATFORM }} \
            --jobs ${{ inputs.jobs }} \
            --configure-only
        env:
          MAKE: make

      - name: Build (make)
        run: |
          node scripts/build-native.mjs \
            --platform ${{ env.PLATFORM }} \
            --jobs ${{ inputs.jobs }} \
            --resume
        env:
          MAKE: make

      - name: Report build output
        if: always()
        run: |
          echo "=== Build directory ==="
          ls -la .build/native-${{ env.PLATFORM }}/ 2>/dev/null || echo "No build directory"
          echo "=== dsoffice ==="
          file .build/native-${{ env.PLATFORM }}/dsoffice 2>/dev/null || echo "No dsoffice"
          echo "=== Disk usage ==="
          df -h /
          du -sh .build/ 2>/dev/null || true

      - name: Report staged package
        if: success()
        run: |
          echo "=== Staged package ==="
          du -sh packages/${{ env.PLATFORM }}/
          echo "=== prebuilds.json ==="
          cat packages/${{ env.PLATFORM }}/prebuilds.json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(f'status: {d[\"status\"]}')
          print(f'version: {d[\"version\"]}')
          print(f'files: {len(d[\"files\"])}')
          print(f'glibcMinimum: {d[\"engine\"].get(\"glibcMinimum\",\"N/A\")}')
          print(f'executable: {d[\"engine\"][\"executable\"]}')
          print(f'programDirectory: {d[\"engine\"][\"programDirectory\"]}')
          "
          echo "=== bin/ ==="
          ls -la packages/${{ env.PLATFORM }}/bin/
          echo "=== program/ (top level) ==="
          ls packages/${{ env.PLATFORM }}/program/ | head -20

      - name: Smoke test (document conversion)
        if: success()
        run: |
          set -euo pipefail
          PKG="packages/${{ env.PLATFORM }}"
          DSOFFICE="$PKG/bin/dsoffice"
          PROGRAM_DIR="$PKG/program/program"
          PROFILE_DIR="$(mktemp -d)"
          INPUT_FILE="$(mktemp -d)/smoke.docx"
          OUTPUT_FILE="$(mktemp -d)/smoke.pdf"

          echo "=== Creating minimal DOCX test file ==="
          python3 -c "
          import zipfile
          content = '''<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>
          <w:document xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\">
            <w:body><w:p><w:r><w:t>Smoke test</w:t></w:r></w:p></w:body>
          </w:document>'''
          rels = '''<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>
          <Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">
            <Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"word/document.xml\"/>
          </Relationships>'''
          doc_rels = '''<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>
          <Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\"/>'''
          ct = '''<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>
          <Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\">
            <Default Extension=\"xml\" ContentType=\"application/xml\"/>
            <Override PartName=\"/word/document.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml\"/>
          </Types>'''
          with zipfile.ZipFile('$INPUT_FILE', 'w', zipfile.ZIP_DEFLATED) as z:
              z.writestr('[Content_Types].xml', ct)
              z.writestr('_rels/.rels', rels)
              z.writestr('word/_rels/document.xml.rels', doc_rels)
              z.writestr('word/document.xml', content)
          print(f'Created: $INPUT_FILE')
          "

          echo "=== Running dsoffice smoke test (DOCX -> PDF) ==="
          LD_LIBRARY_PATH="$PROGRAM_DIR" \
          HOME="$PROFILE_DIR" \
          TMPDIR="$PROFILE_DIR" \
          SAL_DISABLE_PRINTERLIST=1 \
          SAL_DISABLE_DEFAULTPRINTER=1 \
          timeout 60 "$DSOFFICE" \
            --program-directory "$PROGRAM_DIR" \
            --input-path "$INPUT_FILE" \
            --output-path "$OUTPUT_FILE" \
            --profile-directory "$PROFILE_DIR" \
            --max-output-bytes 104857600 \
            --max-image-resolution 300 \
            --format pdf \
            --recalculate false
          EXIT_CODE=$?

          echo "=== dsoffice exit code: $EXIT_CODE ==="
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::dsoffice smoke test FAILED (exit code $EXIT_CODE). The built engine crashes at runtime."
            exit 1
          fi

          echo "=== Checking output file ==="
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "::error::Output PDF was not created. dsoffice did not produce output."
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "$OUTPUT_FILE")
          echo "Output file size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "::error::Output PDF is too small ($FILE_SIZE bytes). Conversion may have failed."
            exit 1
          fi
          file "$OUTPUT_FILE"
          echo "=== Smoke test PASSED ==="

      - name: Upload staged package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: libreoffice-kit-${{ env.PLATFORM }}
          path: packages/${{ env.PLATFORM }}/
          retention-days: 30
          compression-level: 1

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ env.PLATFORM }}
          path: |
            .build/native-${{ env.PLATFORM }}/config_host.mk
            .build/native-${{ env.PLATFORM }}/autogen.input
            .build/native-${{ env.PLATFORM }}/dsh-build-identity.json
          retention-days: 7

      - name: Create GitHub Release
        if: success()
        run: |
          TAG="libreoffice-kit-v0.2.3-linux-x64"
          TARBALL="libreoffice-kit-linux-x64-glibc-0.2.3.tar.gz"
          tar czf "$TARBALL" -C packages/${{ env.PLATFORM }} .
          SHA256=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          echo "SHA256: $SHA256"
          gh release create "$TAG" "$TARBALL" \
            --title "libreoffice-kit 0.2.3 linux-x64-glibc" \
            --notes-file RELEASE.md \
            --target libreoffice-kit-0.2.3-linux-x64
          # Append SHA256 as a release asset
          echo "$SHA256  $TARBALL" > checksums.txt
          gh release upload "$TAG" checksums.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}
