name: Build Linux x64 Native Engine

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Parallelism (make -jN)'
        required: false
        default: '4'
      resume:
        description: 'Resume from existing configure (skip autogen)'
        required: false
        default: 'false'

permissions:
  contents: read

env:
  PLATFORM: linux-x64-glibc

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            python3 git curl binutils flex bison gperf \
            zip unzip gettext \
            libfontconfig-dev libfreetype-dev libharfbuzz-dev \
            libgraphite2-dev libxml2-dev libxslt1-dev zlib1g-dev \
            libjpeg-dev libpng-dev libtiff-dev libglib2.0-dev
          echo "=== Tool versions ==="
          gcc --version | head -1
          make --version | head -1
          autoconf --version | head -1
          node --version
          echo "=== Key tools check ==="
          which gperf && gperf --version | head -1
          pkg-config --modversion fontconfig || echo "fontconfig NOT found"
          pkg-config --modversion freetype2 || echo "freetype2 NOT found"
          pkg-config --modversion harfbuzz || echo "harfbuzz NOT found"

      - name: Checkout LibreOffice core
        run: |
          node scripts/checkout-core.mjs
          echo "=== Core revision ==="
          git -C .build/core rev-parse HEAD
          echo "=== Core source size ==="
          du -sh .build/core

      - name: Configure (autogen)
        run: |
          node scripts/build-native.mjs \
            --platform ${{ env.PLATFORM }} \
            --jobs ${{ inputs.jobs }} \
            --configure-only
        env:
          MAKE: make

      - name: Build (make)
        run: |
          node scripts/build-native.mjs \
            --platform ${{ env.PLATFORM }} \
            --jobs ${{ inputs.jobs }} \
            ${{ inputs.resume == 'true' && '--resume' || '' }}
        env:
          MAKE: make

      - name: Report build output
        if: always()
        run: |
          echo "=== Build directory ==="
          ls -la .build/native-${{ env.PLATFORM }}/ 2>/dev/null || echo "No build directory"
          echo "=== dsoffice ==="
          file .build/native-${{ env.PLATFORM }}/dsoffice 2>/dev/null || echo "No dsoffice"
          echo "=== Disk usage ==="
          df -h /
          du -sh .build/ 2>/dev/null || true

      - name: Report staged package
        if: success()
        run: |
          echo "=== Staged package ==="
          du -sh packages/${{ env.PLATFORM }}/
          echo "=== prebuilds.json ==="
          cat packages/${{ env.PLATFORM }}/prebuilds.json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(f'status: {d[\"status\"]}')
          print(f'version: {d[\"version\"]}')
          print(f'files: {len(d[\"files\"])}')
          print(f'glibcMinimum: {d[\"engine\"].get(\"glibcMinimum\",\"N/A\")}')
          print(f'executable: {d[\"engine\"][\"executable\"]}')
          print(f'programDirectory: {d[\"engine\"][\"programDirectory\"]}')
          "
          echo "=== bin/ ==="
          ls -la packages/${{ env.PLATFORM }}/bin/
          echo "=== program/ (top level) ==="
          ls packages/${{ env.PLATFORM }}/program/ | head -20

      - name: Upload staged package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libreoffice-kit-${{ env.PLATFORM }}
          path: packages/${{ env.PLATFORM }}/
          retention-days: 30
          compression-level: 1

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.PLATFORM }}
          path: |
            .build/native-${{ env.PLATFORM }}/config_host.mk
            .build/native-${{ env.PLATFORM }}/autogen.input
            .build/native-${{ env.PLATFORM }}/dsh-build-identity.json
          retention-days: 7
